<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOTE OS Meet Notes</title><link rel="stylesheet" href="popup.css"></head><body><main><div class="brand">✦ <b>NOTE OS</b></div><h1>Meeting notes</h1><p class="hint">Capture captions shown in your Google Meet tab and save them to your workspace.</p><label>Backend URL<input id="backend" placeholder="https://your-api.onrender.com"></label><label>NOTE OS session token<input id="token" type="password" placeholder="Paste your NOTE OS token"></label><div class="actions"><button id="save" class="secondary">Save settings</button><button id="start">Start capture</button><button id="stop" class="danger">Stop & summarize</button></div><p id="status" role="status">Ready. Turn on captions in Google Meet first.</p><small>Captions are sent to your NOTE OS backend. Inform meeting participants and follow applicable consent rules.</small></main><script src="popup.js"></script></body></html>
