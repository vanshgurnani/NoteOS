<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6f927d">
  <title>You're offline · NOTE OS</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f7f8f6; color: #24332a; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 28rem); padding: 2rem; text-align: center; background: #fff; border: 1px solid #e4e9e4; border-radius: 20px; }
    .mark { width: 54px; height: 54px; margin: 0 auto 18px; }
    p { color: #647268; }
    button { min-height: 44px; border: 0; border-radius: 999px; padding: .8rem 1.2rem; background: #6f927d; color: white; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/icons/noteos.svg" alt="">
    <h1>You're offline</h1>
    <p>Connect to the internet to open your NOTE OS workspace. For your privacy, notes and authenticated data are not stored in the offline cache.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
