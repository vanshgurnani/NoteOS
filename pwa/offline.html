<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6f927d" />
    <title>You're offline · NOTE OS</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f8f6; color: #24332a; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      p { color: #647268; line-height: 1.6; }
      button { border: 0; border-radius: 999px; padding: .8rem 1.2rem; background: #6f927d; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>NOTE OS needs a connection to safely load your workspace. Your private notes have not been copied into an offline cache.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
