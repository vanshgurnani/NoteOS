# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# NoteOS - Render Infrastructure Blueprint (Backend & Frontend)

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI + Uvicorn + RAG / Chat / MCP API)
  # ---------------------------------------------------------------------------
  - type: web
    name: noteos-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard (e.g., mongodb+srv://...)
      - key: MONGO_DB
        value: noteform
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN_REGEX
        value: "^https?:\\\\/\\\\/.*$"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: noteos-frontend
          property: host
      - key: MCP_PUBLIC_URL
        fromService:
          type: web
          name: noteos-backend
          property: host
      # Optional AI Provider API Keys (Can also be configured inside NoteOS Settings UI)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Frontend Web Service (Next.js 14)
  # ---------------------------------------------------------------------------
  - type: web
    name: noteos-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: noteos-backend
          property: host
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: noteos-backend
          property: hostport

  # ---------------------------------------------------------------------------
  # 3. PWA Edge Service (isolated proxy; existing frontend/backend untouched)
  # ---------------------------------------------------------------------------
  - type: web
    name: noteos-pwa
    runtime: node
    rootDir: pwa
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /manifest.webmanifest
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPSTREAM_FRONTEND
        fromService:
          type: web
          name: noteos-frontend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
