# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# NOTE OS - Render Infrastructure Blueprint (FastAPI backend + Next.js PWA frontend)

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI + Uvicorn + RAG / Chat / MCP API)
  # ---------------------------------------------------------------------------
  - type: web
    name: noteos-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard (e.g., mongodb+srv://...)
      - key: MONGO_DB
        value: noteform
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN_REGEX
        value: "^https?:\\/\\/.*$"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: noteos-frontend
          property: host
      - key: REDIS_URL
        fromService:
          type: redis
          name: noteos-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: noteos-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: noteos-redis
          property: connectionString
      - key: MCP_PUBLIC_URL
        value: https://noteos-backend.onrender.com/mcp
      # Optional AI Provider API Keys (Can also be configured inside NoteOS Settings UI)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLAMA_GATEWAY_URL
        value: https://llama-api-gateway.onrender.com
      - key: LLAMA_GATEWAY_MODEL
        value: llama-3.2-3b-instruct
      - key: LLAMA_GATEWAY_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Celery Background Worker Service (Async RAG Embeddings, Indexing, Cleanup)
  # ---------------------------------------------------------------------------
  - type: worker
    name: noteos-celery-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    dockerCommand: celery -A app.workers.celery_app worker --beat --loglevel=info --concurrency=2
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: noteform
      - key: REDIS_URL
        fromService:
          type: redis
          name: noteos-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: noteos-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: noteos-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLAMA_GATEWAY_URL
        value: https://llama-api-gateway.onrender.com
      - key: LLAMA_GATEWAY_MODEL
        value: llama-3.2-3b-instruct
      - key: LLAMA_GATEWAY_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 3. Redis Instance (Message Broker & Result Store for Celery)
  # ---------------------------------------------------------------------------
  - type: redis
    name: noteos-redis
    region: oregon
    plan: free
    ipAllowList: [] # Access restricted to internal Render services
    maxmemoryPolicy: noeviction

  # ---------------------------------------------------------------------------
  # 4. Frontend Web Service (Next.js 14)
  # ---------------------------------------------------------------------------
  - type: web
    name: noteos-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://noteos-backend.onrender.com
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: noteos-backend
          property: hostport


