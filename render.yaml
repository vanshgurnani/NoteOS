# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# NOTE OS - Render Infrastructure Blueprint (FastAPI backend + Next.js PWA frontend)

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI + Uvicorn + RAG / Chat / MCP API)
  # ---------------------------------------------------------------------------
  - type: web
    name: noteos-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard (e.g., mongodb+srv://...)
      - key: MONGO_DB
        value: noteform
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false # Same Google OAuth Web Client ID used by the frontend
      - key: CORS_ORIGIN_REGEX
        value: "^https?:\\/\\/.*$"
      - key: CORS_ORIGINS
        value: https://noteos-frontend.onrender.com
      - key: MCP_PUBLIC_URL
        value: https://noteos-backend.onrender.com/mcp
      # Google Identity Services verifies ID tokens against this OAuth Web Client ID.
      # No Google Client Secret is used by the current GIS credential flow.
      # Private HTTPS email microservice
      - key: MAILER_API_URL
        value: https://noteos-mailer.onrender.com/v1/email/invitations
      - key: MAILER_API_KEY
        sync: false
      - key: APP_URL
        value: https://noteos-frontend.onrender.com
      # Optional AI Provider API Keys (Can also be configured inside NoteOS Settings UI)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLAMA_GATEWAY_URL
        value: https://llama-api-gateway.onrender.com
      - key: LLAMA_GATEWAY_MODEL
        value: llama-3.2-3b-instruct
      - key: LLAMA_GATEWAY_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Frontend Web Service (Next.js 14)
  # ---------------------------------------------------------------------------
  - type: web
    name: noteos-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false # Google Identity Services Web Client ID
      - key: NEXT_PUBLIC_API_URL
        value: https://noteos-backend.onrender.com
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: noteos-backend
          property: hostport


  # ---------------------------------------------------------------------------
  # 3. Private Node.js + Nodemailer email microservice
  # ---------------------------------------------------------------------------
  - type: web
    name: noteos-mailer
    runtime: docker
    rootDir: mailer
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MAILER_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://noteos-frontend.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
